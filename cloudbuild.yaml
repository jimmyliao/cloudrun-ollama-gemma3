steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', 
           '--build-arg', 'MODEL_NAME=${_MODEL_NAME}',
           '-t', '$LOCATION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME', 
           '.']
  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$LOCATION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME']

# Substitution variables
substitutions:
  _MODEL_NAME: gemma3:4b  # Default model, can be overridden

# Store images in Artifact Registry
images:
  - '$LOCATION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME'

# Use specified timeout
timeout: 3600s
